[package]
name = "hm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cross-platform core for HandheldMaid: behavior engine, input hooks, MCP tool contract."

[dependencies]
# Keep this lean. The core must compile on every target Tauri supports.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
rand = "0.8"

# Global keyboard/mouse hooks are behind a feature flag so the core stays
# buildable in headless contexts (CI, unit tests).
rdev = { version = "0.5", optional = true }

[dev-dependencies]
# Deterministic RNG for tests that exercise weighted random selection.
rand_chacha = "0.3"
# Async test runtime for tool::execute tests (dev-only; core ships no runtime).
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["input"]
input = ["dep:rdev"]
