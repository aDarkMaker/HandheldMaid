[package]
name = "hm-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HandheldMaid MCP-style tools: built-in capability tools (time, archive, system_control) and a host for external/official plugins."

[dependencies]
hm-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
chrono = { workspace = true }

# Platform input backend for the `system_control` tool (behind a feature flag).
enigo = { version = "0.2", optional = true }

# Archive backend (zip/tar.gz) for the `archive` tool (behind a feature flag).
zip = { version = "2", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["automation", "archive"]
automation = ["dep:enigo"]
archive = ["dep:zip", "dep:tar", "dep:flate2"]
