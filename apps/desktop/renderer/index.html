<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>HandheldMaid</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<!-- Live2D Cubism Core: must load as a classic script before the app so
		     the global `Live2DCubismCore` is available to pixi-live2d-display. -->
		<script src="/live2dcubismcore.min.js"></script>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
